name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: chmod +x gradlew
      - run: ./gradlew lint testDebugUnitTest assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-and-apk
          path: |
            app/build/reports/
            app/build/outputs/apk/debug/
